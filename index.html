<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#c8a165" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Circus Maximus</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="game" aria-label="Chariot race"></canvas>
    <div id="fps" hidden></div>
    <pre id="overlay" hidden></pre>

      <span class="title">Circus Maximus</span>
      <span class="action">Tap to race</span>
      <span class="help">Tilt to steer, or hold the left or right side of the screen.<br />Keys: ← → or A D.</span>

    <script type="module" src="./src/main.ts"></script>
  </body>
