<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#7a1f12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Circus" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Circus Maximus</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="game" aria-label="Chariot race"></canvas>
    <div id="crash-flash" aria-hidden="true"></div>
    <div id="edge-markers" aria-hidden="true"></div>
    <div id="hud" hidden>
      <span id="hud-lap"></span>
      <span id="hud-place"></span>
      <span id="hud-time"></span>
    </div>
    <div id="fps" hidden></div>
    <pre id="overlay" hidden></pre>
    <button id="start" type="button">
      <span class="title">Circus Maximus</span>
      <span class="action">Tap to race</span>
      <span class="waiting-note">Waiting for motion access…</span>
      <span class="help">Tilt to steer, or hold the left or right side of the screen.<br />Keys: ← → or A D.</span>
      <span class="hint" id="install-hint" hidden>For full screen, tap Share, then Add to Home Screen.</span>
    </button>
    <div id="finish" hidden>
      <span class="title">Finis</span>
      <span class="time" id="finish-time"></span>
      <span class="detail" id="finish-detail"></span>
      <button type="button" id="again" class="action">Race again</button>
    </div>
    <div id="rotate" hidden>
      <span class="phone" aria-hidden="true"></span>
      <span>Turn your phone sideways to race</span>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
