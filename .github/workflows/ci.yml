name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: |
          npm ci
          uv sync --locked

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium webkit

      - name: Run tests
        run: npm test
