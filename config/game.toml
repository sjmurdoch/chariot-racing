# Game settings.
#
# Every setting can be overridden, in increasing order of precedence:
#   1. this file
#   2. an environment variable at build time, named CHARIOT_<TABLE>_<KEY>
#      (for example CHARIOT_RACE_LAPS=3 npm run build)
#   3. a URL query parameter at runtime, named <table>.<key>
#      (for example ?race.laps=3)

[race]
# Number of laps in a race. Historically seven.
laps = 7

[track]
# A compressed Circus Maximus, sized for a race of about two minutes.
# Length of each straight, between the two turning posts (metae), in metres.
straight_length = 150
# Turning radius of the innermost lane, measured from the centre of a meta.
inner_radius = 8
# Width of the track from the innermost lane to the outer wall.
width = 24
# Gap between the innermost lane and the spina wall: about half a quadriga's
# width, so a chariot on the innermost lane is grazing the spina.
spina_clearance = 2

[chariot]
# Cruising speed in metres per second (22 m/s is about 80 km/h).
cruise_speed = 22
# Starting distance out from the innermost lane, in metres.
start_lane = 6

[steering]
# The chariot has its own heading: steering turns it, and with no steering
# it goes in a straight line. At a bend the player must steer round or run
# wide into the outer wall.
# Turning rate at full lock, in degrees per second. Holding the innermost
# lane at cruising speed needs most of it; outer lanes need much less.
max_turn_rate = 180
# Seconds to reach about two-thirds of the steered turning rate.
response = 0.12
# Largest angle, in degrees, the chariot can point away from the track. A
# straight path from the inside lane meets the outer wall at about 75°, so
# this never bends a straight path.
max_heading = 80
# Seconds for a held key or screen half to build up to full lock, and to
# let go again. Tilt steering is proportional, so it isn't ramped.
ramp_up = 0.35
ramp_down = 0.1

[tilt]
# Turning the phone like a steering wheel, held in landscape.
# Wheel angle in degrees that gives full steering lock.
full_lock = 25
# Wheel angles below this many degrees count as straight ahead.
deadzone = 2
# Reverse the steering direction, if tilting right steers left.
invert = false

[camera]
# Driver's eye height above the sand, in metres.
height = 2.1
# Vertical field of view, in degrees.
fov = 70
# How far ahead along the lane the driver looks, in metres.
lookahead = 14

[display]
# Go full screen and lock to landscape when the race starts, where the
# browser allows it (Android, desktop, iPad). iPhones need the game added to
# the Home Screen for full screen, and can't be locked to landscape.
fullscreen = true

[render]
# Upper limit on the device pixel ratio, to protect frame rate on phones.
max_pixel_ratio = 2
# Multisample antialiasing.
antialias = true

[debug]
# Show a frames-per-second counter.
show_fps = false
# Show the debug overlay (build, performance, race state) at start-up. It can
# also be toggled with the backtick key or a three-finger tap.
overlay = false
# Where on the track to start, in segments: 0 is the start line, 1 the far
# turn, 2 the back straight and 3 the near turn. Handy for testing turns.
start_progress = 0.0
